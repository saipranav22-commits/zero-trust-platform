server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: zero-trust-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:zerotrust_db}${POSTGRES_SSL_PARAM:}}
    username: ${POSTGRES_USER:zerotrust}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1000ms
      connect-timeout: 1000ms
      lettuce:
        shutdown-timeout: 200ms
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry-ms: 900000       # 15 minutes
  refresh-token-expiry-ms: 604800000   # 7 days

app:
  seed-demo-data: false
  demo:
    mutations-disabled: false
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    analyst-password: ${DEMO_ANALYST_PASSWORD:}
  security:
    max-failed-logins: 5
    lockout-duration-minutes: 15
    cors-allowed-origins: "http://localhost:3000,http://localhost:5173"
    trusted-proxies: "127.0.0.1,::1"
    encryption:
      key: ${ENCRYPTION_KEY:}

  rate-limit:
    enabled: true
    tiers:
      auth:
        limit: 10
        window-seconds: 60
      transactions:
        limit: 30
        window-seconds: 60
      banking:
        limit: 60
        window-seconds: 60
      admin:
        limit: 40
        window-seconds: 60
      general:
        limit: 120
        window-seconds: 60

  threat-detection:
    enabled: true
    brute-force-threshold: 10
    brute-force-window-minutes: 5
    exfiltration-threshold: 1000
    exfiltration-window-minutes: 5

  ai:
    enabled: ${GEMINI_AI_ENABLED:false}   # Set to true and provide gemini-api-key to enable RAG
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: "gemini-1.5-flash"
    gemini-api-url: "https://generativelanguage.googleapis.com/v1beta/models"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: Zero Trust Security Platform API
    version: "1.0"
    description: "AI-Powered Zero Trust Data Protection Platform"

logging:
  level:
    com.zerotrust: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId}] %logger{36} - %msg%n"
