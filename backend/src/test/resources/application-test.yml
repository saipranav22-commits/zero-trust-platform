server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:zerotrust_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms

jwt:
  secret: "test-jwt-secret-key-for-unit-testing-purposes-must-be-at-least-256-bits-long"
  access-token-expiry-ms: 60000
  refresh-token-expiry-ms: 3600000

app:
  seed-demo-data: true
  rate-limit:
    enabled: false
  security:
    max-failed-logins: 5
    lockout-duration-minutes: 15
    cors-allowed-origins: "http://localhost:3000"
    trusted-proxies: "127.0.0.1,::1"
    encryption:
      key: "k+u7V2Xg4qH8lK9pY0rW3tU6yI8oP1aS4dF7gJ0kM3o="
  threat-detection:
    enabled: true
    brute-force-threshold: 10
    brute-force-window-minutes: 5
    exfiltration-threshold: 1000
    exfiltration-window-minutes: 5
  ai:
    enabled: false
    gemini-api-key: ""
